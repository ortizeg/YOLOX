[project]
name = "yolox"
version = "0.3.1"
description = "YOLOX object detection with DINO-X improvements"
channels = ["nvidia", "conda-forge", "pytorch"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.12"
cuda-toolkit = "12.1.*"
pytorch-cuda = "12.1.*"

[pypi-dependencies]
torch = ">=2.4.0,<2.6"
torchvision = ">=0.19.0,<0.21"
numpy = ">=2.0"
opencv-python = ">=4.10.0"
loguru = ">=0.7.0"
tqdm = ">=4.66.0"
thop = ">=0.1.1"
tabulate = ">=0.9.0"
psutil = ">=6.0.0"
tensorboard = ">=2.18.0"
pycocotools = ">=2.0.8"
onnx = ">=1.17.0"
onnx-simplifier = ">=0.4.36"

[feature.dev.pypi-dependencies]
pytest = ">=8.0"
ruff = ">=0.4.0"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
train = "python -m yolox.tools.train"
eval = "python tools/eval.py"
test = "python -m pytest tests/ -v --tb=short"
